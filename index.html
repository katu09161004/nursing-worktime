<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>看護業務量調査</title>
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="業務量調査">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root{
    --bg:#eef2f4; --panel:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#dbe3e8; --accent:#0f766e; --danger:#b91c1c; --warn:#b45309;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 6px 18px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:760px; margin:0 auto; padding:12px 12px 40px}

  /* ---- 現在の記録バナー ---- */
  .now{
    position:sticky; top:8px; z-index:5;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px;
  }
  .now-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .who{font-size:13px; color:var(--muted); font-weight:600}
  .who b{color:var(--ink)}
  .now-body{display:flex; align-items:baseline; gap:12px; margin-top:8px; flex-wrap:wrap}
  .now-label{font-size:22px; font-weight:800; letter-spacing:.01em}
  .now-idle{color:var(--muted); font-weight:700}
  .now-timer{font-variant-numeric:tabular-nums; font-size:30px; font-weight:800; color:var(--accent); line-height:1}
  .now-since{font-size:12px; color:var(--muted)}
  .now-hint{font-size:12px; color:var(--muted); font-weight:700; flex-basis:100%; margin-top:2px}
  .now-end{margin-left:auto; border:none; border-radius:10px; background:var(--ink); color:#fff;
           padding:10px 16px; font-size:14px; font-weight:800; cursor:pointer}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;
       box-shadow:0 0 0 0 rgba(15,118,110,.5); animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,118,110,.45)}70%{box-shadow:0 0 0 10px rgba(15,118,110,0)}100%{box-shadow:0 0 0 0 rgba(15,118,110,0)}}

  /* ---- カテゴリ ---- */
  .maj-h{margin:22px 4px 6px; font-size:15px; font-weight:800; color:var(--ink);
         border-bottom:2px solid var(--line); padding-bottom:6px}

  /* ---- 1段目: 中分類カード ---- */
  .cat{display:block; width:100%; text-align:left; margin:10px 0; cursor:pointer;
       background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--c,#0f766e);
       border-radius:14px; box-shadow:var(--shadow); padding:14px 16px}
  .cat-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .cat-name{font-size:17px; font-weight:800; color:var(--ink)}
  .cat-arrow{color:var(--muted); font-size:18px; font-weight:800}
  .cat-list{margin-top:6px; font-size:12px; color:var(--muted); line-height:1.5}
  .cat.on{border-color:transparent; border-left-color:var(--c,#0f766e); background:var(--c,#0f766e)}
  .cat.on .cat-name,.cat.on .cat-arrow{color:#fff}
  .cat.on .cat-list{color:rgba(255,255,255,.9)}
  .cat-run{display:inline-block; font-size:11px; font-weight:800; color:#fff;
           background:rgba(255,255,255,.25); border-radius:6px; padding:2px 7px; margin-left:8px}

  /* ---- 2段目: 小分類 ---- */
  .sub-top{display:flex; align-items:center; gap:12px; margin:14px 4px 12px}
  .back-btn{border:1px solid var(--line); background:var(--panel); border-radius:10px;
            padding:9px 14px; font-size:14px; font-weight:800; color:var(--ink); cursor:pointer}
  .sub-title{display:flex; align-items:center; gap:8px; font-size:17px}
  .note{display:block; font-size:10px; font-weight:600; color:var(--muted); margin-top:3px; line-height:1.35}
  .btn.on .note{color:rgba(255,255,255,.9)}

  /* ---- 勤務時間内/外 トグル ---- */
  .ot{display:flex; gap:6px; margin-top:10px; background:var(--bg); border-radius:12px; padding:4px}
  .ot button{flex:1; border:none; background:transparent; border-radius:9px; padding:9px 8px;
             font-size:13px; font-weight:800; color:var(--muted); cursor:pointer}
  .ot button.sel{background:var(--panel); color:var(--ink); box-shadow:var(--shadow)}
  .ot button.sel[data-ot="1"]{background:var(--warn); color:#fff}
  .swatch{width:12px;height:12px;border-radius:3px}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .btn{
    appearance:none; border:1px solid var(--line); background:var(--panel);
    border-radius:14px; padding:18px 14px; min-height:76px; font-size:16px; font-weight:700;
    color:var(--ink); text-align:left; line-height:1.35; box-shadow:var(--shadow);
    display:flex; flex-direction:column; justify-content:center; gap:4px; cursor:pointer;
    transition:transform .05s ease, box-shadow .1s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.on{color:#fff; border-color:transparent}
  .btn .ai{font-size:11px; font-weight:800; opacity:.85}
  .btn .ai::before{content:"AI "; }
  .btn.on .ai{opacity:.95}

  /* ---- 下部操作 ---- */
  .actions{display:flex; gap:10px; margin-top:22px}
  .act{
    flex:1; border-radius:14px; padding:16px; font-size:15px; font-weight:800; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); box-shadow:var(--shadow);
  }
  .act.end{background:var(--ink); color:#fff; border-color:transparent}
  .act.undo{color:var(--danger)}
  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:12px; color:var(--muted)}
  .link{color:var(--accent); font-weight:700; text-decoration:none}
  .queue{color:var(--warn); font-weight:700}

  /* ---- セットアップ画面 ---- */
  .setup{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px}
  .setup h1{font-size:18px; margin:0 0 4px}
  .setup p{color:var(--muted); margin:0 0 18px; font-size:13px}
  .field{margin-bottom:16px}
  .field label{display:block; font-size:13px; font-weight:800; margin-bottom:8px; color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer}
  .chip.sel{background:var(--accent); color:#fff; border-color:transparent}
  .staffgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .staffgrid .chip{text-align:center}
  .staff-input{width:100%; padding:14px 16px; border:1px solid var(--line); border-radius:12px;
    font-size:18px; font-weight:700; letter-spacing:.06em; background:#fff; color:var(--ink)}
  .staff-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(15,118,110,.15)}
  .staff-hint{font-size:12px; color:var(--muted); margin-top:6px}
  .start{width:100%; margin-top:6px; padding:16px; border:none; border-radius:14px; background:var(--ink); color:#fff; font-size:16px; font-weight:800; cursor:pointer}
  .start:disabled{opacity:.4}
  .hide{display:none}

  /* ---- 業務終了サマリー ---- */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:30;
           display:flex; align-items:center; justify-content:center; padding:20px}
  /* .hide より後に .overlay を書いているため、詳細度で上書きしないと常時表示になる */
  .overlay.hide{display:none}
  .done{background:var(--panel); border-radius:20px; box-shadow:var(--shadow);
        padding:24px 22px; width:100%; max-width:380px; text-align:center}
  .done-h{font-size:13px; font-weight:800; color:var(--muted); margin-bottom:10px}
  .done-label{font-size:24px; font-weight:800; line-height:1.3; margin-bottom:14px}
  .done-range{font-size:16px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
  .done-dur{font-size:34px; font-weight:800; color:var(--accent); margin:8px 0 20px;
            font-variant-numeric:tabular-nums; line-height:1}
  .done-ok{width:100%; padding:16px; border:none; border-radius:14px; background:var(--ink);
           color:#fff; font-size:17px; font-weight:800; cursor:pointer}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-weight:700; font-size:14px;
    box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; z-index:20}
  .toast.show{opacity:1}
  .vw{margin:14px 0 4px}
  .list-mid{margin:14px 4px 8px; font-size:13px; font-weight:800; color:#5b6b7a; display:flex; align-items:center; gap:8px}
  .list-mid .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
  .more-link{background:none;border:none;color:#0f766e;font-weight:700;font-size:13px;cursor:pointer;padding:0;margin:-4px 0 14px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">

  <!-- セットアップ -->
  <section id="setup" class="setup hide">
    <h1>記録を始める</h1>
    <p>従業員番号を入力し、病棟を選んでください。勤務帯は前回のまま使えます。次回から自動で開きます。</p>
    <div class="field">
      <label>従業員番号</label>
      <input type="text" id="staffInput" class="staff-input" inputmode="text"
             autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="例: 100234 / NS12" maxlength="20">
      <div class="staff-hint">半角の数字・英字で入力してください（英字は大文字に統一されます）</div>
    </div>
    <div class="field">
      <label>病棟</label>
      <div id="wardChips" class="chips"></div>
    </div>
    <button type="button" id="moreToggle" class="more-link">▾ 勤務帯を変更</button>
    <div class="field hide" id="shiftField">
      <label>勤務帯</label>
      <div id="shiftChips" class="chips"></div>
    </div>
    <button id="startBtn" class="start" disabled>この設定で記録を始める</button>
  </section>

  <!-- 記録画面 -->
  <section id="main" class="hide">
    <div class="now">
      <div class="now-top">
        <div class="who">担当 <b id="whoStaff">-</b> ／ <b id="whoWard">-</b> ／ <b id="whoShift">-</b></div>
        <a href="#" id="changeBtn" class="link">担当変更</a>
      </div>
      <div class="now-body" id="nowBody">
        <span class="now-idle">記録待機中 — 業務ボタンを押してください</span>
      </div>
      <div class="ot" id="otToggle">
        <button data-ot="0" class="sel">勤務時間内</button>
        <button data-ot="1">勤務時間外</button>
      </div>
    </div>

    <!-- 表示切替: 分類から / 一覧から -->
    <div class="ot vw" id="viewToggle">
      <button data-vw="cat" class="sel">分類から選ぶ</button>
      <button data-vw="list">一覧から選ぶ</button>
    </div>

    <!-- 1段目: 中分類を選ぶ（分類ビュー） -->
    <div id="catScreen"></div>

    <!-- 2段目: 選んだ中分類の小分類だけを出す -->
    <div id="subScreen" class="hide">
      <div class="sub-top">
        <button class="back-btn" id="backBtn">← 戻る</button>
        <div class="sub-title"><span class="swatch" id="subSwatch"></span><b id="subTitle">-</b></div>
      </div>
      <div id="subGrid" class="grid"></div>
    </div>

    <!-- 一覧ビュー: 全小分類を大分類ごとに並べる -->
    <div id="listScreen" class="hide"></div>

    <div class="actions">
      <button class="act undo" id="undoBtn">直前を取り消す</button>
      <button class="act end" id="endBtn">記録終了</button>
    </div>

    <div class="foot">
      <a class="link" href="/dashboard" target="_blank">集計ダッシュボード →</a>
      <span id="queueInfo" class="queue"></span>
    </div>
  </section>

</div>

<!-- 業務終了サマリー（OKで閉じる） -->
<div id="doneOverlay" class="overlay hide">
  <div class="done">
    <div class="done-h">業務を終了しました</div>
    <div class="done-label" id="doneLabel">-</div>
    <div class="done-range" id="doneRange">-</div>
    <div class="done-dur" id="doneDur">-</div>
    <button class="done-ok" id="doneOk">OK</button>
  </div>
</div>

<div id="toast" class="toast"></div>


<script>
const LS = "nwt.session.v1";
const OUTBOX = "nwt.outbox.v1";
const OT = "nwt.overtime.v1";
let CFG = null;
let sess = JSON.parse(localStorage.getItem(LS) || "null"); // {staff,ward,shift}
let overtime = JSON.parse(localStorage.getItem(OT) || "false"); // false=勤務時間内 / true=時間外
const VW = "nwt.view.v1";
let view = localStorage.getItem(VW) || "cat"; // "cat"=分類から / "list"=一覧から
let pick = {staff:null, ward:null, shift:null};
let current = null;      // {label, since}
let timerHandle = null;

const $ = s => document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

async function boot(){
  CFG = await (await fetch("/api/config")).json();
  paintOt();
  if(sess && sess.staff){ showMain(); } else { showSetup(); }
  flushOutbox();
  setInterval(flushOutbox, 15000);
}

/* ---- 勤務時間内 / 勤務時間外 ---- */
function paintOt(){
  document.querySelectorAll("#otToggle button").forEach(b=>
    b.classList.toggle("sel", (b.dataset.ot==="1")===overtime));
}
document.querySelectorAll("#otToggle button").forEach(b=>{
  b.onclick=async ()=>{
    const next = b.dataset.ot==="1";
    if(next===overtime) return;
    overtime=next; localStorage.setItem(OT, JSON.stringify(overtime)); paintOt();
    // 実行中の業務があれば、切替時点で区間を割って同じ業務を新しい時間区分で打ち直す。
    // こうしないと、残業に入った瞬間から後ろも「勤務時間内」のまま計上されてしまう。
    if(current){
      const ts=new Date().toISOString();
      current={...current, since:ts}; renderNow();
      await send("/api/punch", {staff_id:sess.staff, ward:sess.ward, shift:sess.shift,
                                category:current.category, subcategory:current.subcategory, ts, overtime});
    }
    toast(overtime?"勤務時間外に切り替えました":"勤務時間内に切り替えました");
  };
});

/* ---------------- セットアップ ---------------- */
function showSetup(){
  $("#setup").classList.remove("hide"); $("#main").classList.add("hide");
  pick = Object.assign({staff:null,ward:null,shift:null}, sess||{});
  if(!pick.shift) pick.shift = CFG.shifts[0];   // 勤務帯は前回値（無ければ先頭）を既定に
  $("#shiftField").classList.add("hide");        // 勤務帯は隠しておく
  const si=$("#staffInput");
  si.value = pick.staff || "";        // 前回の従業員番号を復元
  renderChips("#wardChips", CFG.wards, "ward");
  renderChips("#shiftChips", CFG.shifts, "shift");
  validate();
}

// 従業員番号は半角の英数字のみ。英字は大文字に寄せ、集計で N-01 と n-01 が
// 別人に割れないようにする（集計は staff_id 文字列そのままで突き合わせるため）。
function normStaff(v){ return (v||"").toUpperCase().replace(/[^0-9A-Z]/g, ""); }
$("#staffInput").addEventListener("input", e=>{
  const start=e.target.selectionStart;
  const before=e.target.value;
  const cleaned=normStaff(before);
  e.target.value=cleaned;
  // 消えた文字数だけキャレット位置を戻す（末尾入力なら影響なし）
  if(cleaned!==before){ const d=before.length-cleaned.length; try{e.target.setSelectionRange(start-d,start-d);}catch(_){} }
  pick.staff=cleaned;
  validate();
});
function renderChips(sel, items, key){
  const box = $(sel); box.innerHTML="";
  items.forEach(v=>{
    const c=document.createElement("div");
    c.className="chip"+(pick[key]===v?" sel":"");
    c.textContent=v;
    c.onclick=()=>{ pick[key]=v; renderChips(sel,items,key); validate(); };
    box.appendChild(c);
  });
}
function updateMore(){ const el=$("#moreToggle"); if(el) el.textContent = "▾ 勤務帯: " + (pick.shift||"-") + "（変更）"; }
function validate(){ $("#startBtn").disabled = !(pick.staff && pick.staff.length>=1 && pick.ward); updateMore(); }
$("#startBtn").onclick=()=>{
  sess={staff:pick.staff, ward:pick.ward, shift:pick.shift};
  localStorage.setItem(LS, JSON.stringify(sess));
  showMain();
};
$("#moreToggle").onclick=()=>{ $("#shiftField").classList.toggle("hide"); };

/* ---------------- 記録画面 ---------------- */
function showMain(){
  $("#setup").classList.add("hide"); $("#main").classList.remove("hide");
  $("#whoStaff").textContent=sess.staff; $("#whoWard").textContent=sess.ward; $("#whoShift").textContent=sess.shift;
  renderCats();
  renderList();
  applyView();
  refreshCurrent();
}
$("#changeBtn").onclick=(e)=>{ e.preventDefault(); showSetup(); };

/* 1段目: 中分類カード。中身の小分類を並べて、開かなくても何が入っているか分かるようにする。 */
function renderCats(){
  const box=$("#catScreen"); box.innerHTML="";
  let lastGroup=null;
  CFG.categories.forEach(cat=>{
    // 大分類（A〜D）が変わったら、集計用紙と同じ見出しを挟む
    if(cat.group && cat.group!==lastGroup){
      const gh=document.createElement("div"); gh.className="maj-h"; gh.textContent=cat.group;
      box.appendChild(gh); lastGroup=cat.group;
    }
    const b=document.createElement("button"); b.className="cat"; b.dataset.cat=cat.key;
    b.style.setProperty("--c", cat.color);
    b.innerHTML=`<div class="cat-top">
        <span class="cat-name">${cat.label}<span class="cat-run" data-run="${cat.key}" style="display:none"></span></span>
        <span class="cat-arrow">›</span>
      </div>
      <div class="cat-list">${cat.subs.map(s=>s.label).join("・")}</div>`;
    b.onclick=()=>openCat(cat);
    box.appendChild(b);
  });
  paintActive();
}

/* 2段目: 選んだ中分類の小分類だけを出す */
function openCat(cat){
  $("#subTitle").textContent=cat.label;
  $("#subSwatch").style.background=cat.color;
  const grid=$("#subGrid"); grid.innerHTML="";
  cat.subs.forEach(sub=>{
    const b=document.createElement("button"); b.className="btn"; b.dataset.cat=cat.key; b.dataset.sub=sub.key;
    b.style.setProperty("--c",cat.color);
    b.innerHTML = sub.label
      + (sub.ai_tool?`<span class="ai">${sub.ai_tool}</span>`:"")
      + (sub.note?`<span class="note">※${sub.note}</span>`:"");
    b.onclick=()=>punch(cat, sub, b);
    grid.appendChild(b);
  });
  $("#catScreen").classList.add("hide");
  $("#subScreen").classList.remove("hide");
  paintActive(); window.scrollTo(0,0);
}

function showCats(){
  $("#subScreen").classList.add("hide");
  $("#catScreen").classList.remove("hide");
  paintActive(); window.scrollTo(0,0);
}
$("#backBtn").onclick=showCats;

/* ---- 表示切替（分類から / 一覧から）---- */
function paintVw(){ document.querySelectorAll("#viewToggle button").forEach(b=>b.classList.toggle("sel", b.dataset.vw===view)); }
function applyView(){
  paintVw();
  if(view==="list"){
    $("#catScreen").classList.add("hide"); $("#subScreen").classList.add("hide");
    $("#listScreen").classList.remove("hide");
  }else{
    $("#listScreen").classList.add("hide"); $("#subScreen").classList.add("hide");
    $("#catScreen").classList.remove("hide");
  }
  paintActive();
}
document.querySelectorAll("#viewToggle button").forEach(b=>{
  b.onclick=()=>{ view=b.dataset.vw; localStorage.setItem(VW, view); applyView(); window.scrollTo(0,0); };
});

/* 一覧ビュー: 全小分類を 大分類→中分類 ごとに並べる */
function renderList(){
  const box=$("#listScreen"); box.innerHTML="";
  let lastGroup=null;
  CFG.categories.forEach(cat=>{
    if(cat.group && cat.group!==lastGroup){
      const gh=document.createElement("div"); gh.className="maj-h"; gh.textContent=cat.group;
      box.appendChild(gh); lastGroup=cat.group;
    }
    const mh=document.createElement("div"); mh.className="list-mid";
    mh.innerHTML=`<span class="sw" style="background:${cat.color}"></span>${cat.label}`;
    box.appendChild(mh);
    const grid=document.createElement("div"); grid.className="grid";
    cat.subs.forEach(sub=>{
      const b=document.createElement("button"); b.className="btn"; b.dataset.cat=cat.key; b.dataset.sub=sub.key;
      b.style.setProperty("--c",cat.color);
      b.innerHTML = sub.label
        + (sub.ai_tool?`<span class="ai">${sub.ai_tool}</span>`:"")
        + (sub.note?`<span class="note">※${sub.note}</span>`:"");
      b.onclick=()=>punch(cat, sub, b);
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
  paintActive();
}

function paintActive(){
  document.querySelectorAll(".btn").forEach(b=>{
    const on = current && b.dataset.cat===current.category && b.dataset.sub===current.subcategory;
    b.classList.toggle("on", !!on);
    b.style.background = on ? getColor(b.dataset.cat) : "";
  });
  // 実行中の業務がある中分類カードを塗り、何を記録中かカードにも出す
  document.querySelectorAll(".cat").forEach(b=>{
    b.classList.toggle("on", !!(current && b.dataset.cat===current.category));
  });
  document.querySelectorAll("[data-run]").forEach(el=>{
    const on = current && el.dataset.run===current.category;
    el.style.display = on ? "inline-block" : "none";
    if(on) el.textContent = "記録中 " + current.label;
  });
}
function getColor(catKey){ const c=CFG.categories.find(x=>x.key===catKey); return c?c.color:"#0f766e"; }

async function punch(cat, sub, btn){
  // 実行中の業務と同じボタンをもう一度押したら、その業務を終了して待機に戻す。
  // 別の業務ボタンなら従来どおり打刻して切り替える（前の区間はそこで確定する）。
  if(current && current.category===cat.key && current.subcategory===sub.key){
    await endCurrent(`${sub.label} を終了しました`);
    return;
  }
  const ts=new Date().toISOString();
  const body={staff_id:sess.staff, ward:sess.ward, shift:sess.shift, category:cat.key, subcategory:sub.key, ts, overtime};
  current={category:cat.key, subcategory:sub.key, label:sub.label, since:ts};
  paintActive(); renderNow();
  // 打刻しても画面は戻さない。押した業務が緑のまま残り、上にタイマーが出る。
  await send("/api/punch", body);
}

/* ENDマーカーを打って待機状態へ戻す。最終区間はここで確定する。 */
async function endCurrent(msg){
  const ts=new Date().toISOString();
  const done = current ? {label:current.label, since:current.since, until:ts} : null;
  current=null; paintActive(); renderNow();
  await send("/api/end", {staff_id:sess.staff, ward:sess.ward, shift:sess.shift, category:"END", ts, overtime});
  // 実行中の業務があったときは、確定した区間を出して確認してもらう。
  // 何も実行していなければ出すものが無いのでトーストだけ。
  if(done) showDone(done); else toast(msg);
}

$("#endBtn").onclick=async ()=>{ await endCurrent("記録を終了しました"); };

/* ---- 業務終了サマリー ---- */
function showDone(d){
  $("#doneLabel").textContent = d.label;
  $("#doneRange").textContent = `${fmt(d.since)} 〜 ${fmt(d.until)}`;
  $("#doneDur").textContent = durText(d.since, d.until);
  $("#doneOverlay").classList.remove("hide");
}
function durText(since, until){
  const sec=Math.max(0, Math.round((new Date(until)-new Date(since))/1000));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if(h>0) return `${h}時間${m}分${s}秒`;
  if(m>0) return `${m}分${s}秒`;
  return `${s}秒`;
}
$("#doneOk").onclick=()=>$("#doneOverlay").classList.add("hide");

$("#undoBtn").onclick=async ()=>{
  try{
    const r=await fetch("/api/undo?staff_id="+encodeURIComponent(sess.staff), {method:"POST"});
    if(!r.ok) throw 0;
    toast("直前の打刻を取り消しました");
    await refreshCurrent();
  }catch(e){ toast("取り消せませんでした"); }
};

async function refreshCurrent(){
  try{
    const r=await fetch("/api/current?staff_id="+encodeURIComponent(sess.staff));
    const d=await r.json();
    current = d.active ? {category:d.category, subcategory:d.subcategory, label:d.label, since:d.since} : null;
  }catch(e){ /* オフライン時は直近のローカル状態を維持 */ }
  paintActive(); renderNow();
}

/* ---- 現在バナー + 経過タイマー ---- */
function renderNow(){
  const body=$("#nowBody");
  if(!current){ body.innerHTML=`<span class="now-idle">記録待機中 — 業務ボタンを押してください</span>`; stopTimer(); return; }
  body.innerHTML=`<span class="now-label"><span class="dot"></span>${current.label}</span>
                  <span class="now-timer" id="elapsed">0:00</span>
                  <span class="now-since">開始 ${fmt(current.since)}</span>
                  <button class="now-end" id="nowEnd">この業務を終了</button>`;
  // 2段階になり、同じボタンまで戻るのに手数がかかるので、ここから1タップで終われるようにする
  $("#nowEnd").onclick=()=>endCurrent(`${current ? current.label : ""} を終了しました`);
  startTimer();
}
function startTimer(){ stopTimer(); tick(); timerHandle=setInterval(tick,1000); }
function stopTimer(){ if(timerHandle){clearInterval(timerHandle); timerHandle=null;} }
function tick(){
  const el=$("#elapsed"); if(!el||!current) return;
  // since から都度計算する。タブが非表示でsetIntervalが間引かれても表示は狂わない。
  const sec=Math.max(0, Math.floor((Date.now()-new Date(current.since))/1000));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  const pad=n=>String(n).padStart(2,"0");
  el.textContent = h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function fmt(iso){ const d=new Date(iso); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

/* ---- 送信 + オフライン退避 ---- */
async function send(url, body){
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) throw 0;
  }catch(e){
    const ob=JSON.parse(localStorage.getItem(OUTBOX)||"[]");
    ob.push({url, body}); localStorage.setItem(OUTBOX, JSON.stringify(ob));
    updateQueue();
  }
}
async function flushOutbox(){
  let ob=JSON.parse(localStorage.getItem(OUTBOX)||"[]");
  if(!ob.length){ updateQueue(); return; }
  const rest=[];
  for(const item of ob){
    try{
      const r=await fetch(item.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item.body)});
      if(!r.ok) throw 0;
    }catch(e){ rest.push(item); }
  }
  localStorage.setItem(OUTBOX, JSON.stringify(rest));
  updateQueue();
}
function updateQueue(){
  const ob=JSON.parse(localStorage.getItem(OUTBOX)||"[]");
  $("#queueInfo").textContent = ob.length ? `未送信 ${ob.length}件（自動再送）` : "";
}

boot();
</script>
</body>
</html>
