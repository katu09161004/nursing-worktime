<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集計ダッシュボード｜看護業務量調査</title>
<style>
  :root{
    --bg:#eef2f4; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#dbe3e8;
    --accent:#0f766e; --ai:#b45309; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
       background:var(--bg); color:var(--ink)}
  .wrap{max-width:960px; margin:0 auto; padding:20px 16px 60px}
  h1{font-size:20px; margin:0 0 2px}
  .sub{color:var(--muted); font-size:13px; margin:0 0 18px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px}
  .card h2{font-size:14px; margin:0 0 14px; color:var(--muted); font-weight:800; letter-spacing:.02em}

  /* filters */
  .filters{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
  .f label{display:block; font-size:11px; font-weight:800; color:var(--muted); margin-bottom:5px}
  .f input,.f select{padding:9px 11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff}
  .btnrow{display:flex; gap:8px; margin-left:auto}
  .b{padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:14px; cursor:pointer}
  .b.primary{background:var(--ink); color:#fff; border-color:transparent}

  .meta{display:flex; gap:22px; flex-wrap:wrap; margin-bottom:4px}
  .meta div{font-size:13px; color:var(--muted)}
  .meta b{font-size:20px; color:var(--ink); font-variant-numeric:tabular-nums; margin-right:4px}

  /* AI baseline */
  .ai-card{border:1px solid #f0d9b8; background:linear-gradient(180deg,#fffaf1,#ffffff)}
  .ai-card h2{color:var(--ai)}
  .ai-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
  .ai-item{border:1px solid #f0d9b8; border-radius:14px; padding:14px 16px; background:#fff}
  .ai-tool{font-size:11px; font-weight:800; color:var(--ai); letter-spacing:.02em}
  .ai-name{font-size:14px; font-weight:800; margin:2px 0 10px}
  .ai-big{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
  .ai-unit{font-size:12px; color:var(--muted); font-weight:700}
  .ai-sup{font-size:12px; color:var(--muted); margin-top:6px}

  /* bars */
  .bar{display:flex; align-items:center; gap:12px; margin:9px 0}
  .bar .name{width:120px; font-size:13px; font-weight:700; flex:none}
  .bar .track{flex:1; background:#f1f5f7; border-radius:8px; height:22px; overflow:hidden}
  .bar .fill{height:100%; border-radius:8px}
  .bar .val{width:96px; text-align:right; font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted); flex:none}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-size:11px; font-weight:800}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .tag{display:inline-block; font-size:10px; font-weight:800; color:var(--ai); background:#fdf3e3; border-radius:6px; padding:2px 7px}
  .empty{color:var(--muted); font-size:14px; padding:20px 0; text-align:center}
  a.back{color:var(--accent); text-decoration:none; font-weight:700; font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:960px;margin:0 auto 10px;padding:9px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:12px;font-weight:700;text-align:center">デモ版：サンプル動作です。データは端末内のみで、サーバには送信されません。 <a href="./demo.html" style="color:#0f766e">記録デモを触る →</a></div>
  <a class="back" href="./demo.html">← 記録画面へ</a>
  <h1 style="margin-top:10px">集計ダッシュボード</h1>
  <p class="sub">AI導入前後の比較ベースライン／多職種協働加算エビデンス用</p>

  <div class="card">
    <div class="filters">
      <div class="f"><label>開始日</label><input type="date" id="from"></div>
      <div class="f"><label>終了日</label><input type="date" id="to"></div>
      <div class="f"><label>病棟</label><select id="ward"><option value="">すべて</option></select></div>
      <div class="f"><label>勤務帯</label><select id="shift"><option value="">すべて</option></select></div>
      <div class="f"><label><input type="checkbox" id="susp"> 打ち忘れ疑いも含める</label></div>
      <div class="btnrow">
        <button class="b primary" id="apply">集計</button>
        <button class="b" id="csv">CSV出力</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="meta">
      <div><b id="mSessions">–</b>のべ勤務数</div>
      <div><b id="mTotal">–</b>総記録時間(時)</div>
      <div><b id="mIntervals">–</b>記録区間数</div>
    </div>
    <p class="sub" style="margin:6px 0 0">「1シフトあたり」= 総時間 ÷ のべ勤務数。同一値を導入後にも算出すれば差分がAI効果になります。</p>
  </div>

  <div class="card ai-card">
    <h2>★ AI効果測定ベースライン（対象業務の1シフトあたり所要時間）</h2>
    <div id="aiGrid" class="ai-grid"></div>
  </div>

  <div class="card">
    <h2>大区分別 時間配分</h2>
    <div id="catBars"></div>
  </div>

  <div class="card">
    <h2>小区分別 明細</h2>
    <table>
      <thead><tr>
        <th>大区分</th><th>小区分</th>
        <th class="num">合計(分)</th><th class="num">1シフト(分)</th>
        <th class="num">回数</th><th class="num">割合</th>
      </tr></thead>
      <tbody id="subRows"></tbody>
    </table>
    <div id="subEmpty" class="empty" style="display:none">データがありません。記録画面で打刻するとここに集計されます。</div>
  </div>
</div>


<script>
const DEMO_SUMMARY = {"total_minutes": 544.0, "n_sessions": 3, "n_intervals": 25, "categories": [{"category": "record", "cat_label": "記録", "minutes": 202.0, "pct": 37.1}, {"category": "direct", "cat_label": "直接看護", "minutes": 132.0, "pct": 24.3}, {"category": "share", "cat_label": "情報共有", "minutes": 85.0, "pct": 15.6}, {"category": "off", "cat_label": "休憩・待機", "minutes": 85.0, "pct": 15.6}, {"category": "indirect", "cat_label": "間接看護", "minutes": 30.0, "pct": 5.5}, {"category": "misc", "cat_label": "移動・教育・その他", "minutes": 10.0, "pct": 1.8}], "subcategories": [{"category": "record", "cat_label": "記録", "subcategory": "soap", "sub_label": "看護記録・SOAP入力", "ai_tool": "medai SOAP Voice", "minutes": 100.0, "count": 4, "pct": 18.4, "min_per_session": 33.3}, {"category": "off", "cat_label": "休憩・待機", "subcategory": "break", "sub_label": "休憩", "ai_tool": "", "minutes": 85.0, "count": 2, "pct": 15.6, "min_per_session": 28.3}, {"category": "direct", "cat_label": "直接看護", "subcategory": "obs", "sub_label": "観察・バイタル測定", "ai_tool": "", "minutes": 68.0, "count": 3, "pct": 12.5, "min_per_session": 22.7}, {"category": "record", "cat_label": "記録", "subcategory": "summary", "sub_label": "退院時サマリー作成", "ai_tool": "SummyAI", "minutes": 68.0, "count": 3, "pct": 12.5, "min_per_session": 22.7}, {"category": "share", "cat_label": "情報共有", "subcategory": "conf", "sub_label": "カンファレンス・会議", "ai_tool": "議事録自動生成", "minutes": 62.0, "count": 2, "pct": 11.4, "min_per_session": 20.7}, {"category": "direct", "cat_label": "直接看護", "subcategory": "care", "sub_label": "処置・与薬", "ai_tool": "", "minutes": 30.0, "count": 2, "pct": 5.5, "min_per_session": 10.0}, {"category": "direct", "cat_label": "直接看護", "subcategory": "adl", "sub_label": "清潔・排泄ケア", "ai_tool": "", "minutes": 22.0, "count": 1, "pct": 4.0, "min_per_session": 7.3}, {"category": "record", "cat_label": "記録", "subcategory": "chart", "sub_label": "温度板・観察記録入力", "ai_tool": "", "minutes": 20.0, "count": 1, "pct": 3.7, "min_per_session": 6.7}, {"category": "indirect", "cat_label": "間接看護", "subcategory": "prep", "sub_label": "物品準備・片付け", "ai_tool": "", "minutes": 18.0, "count": 1, "pct": 3.3, "min_per_session": 6.0}, {"category": "share", "cat_label": "情報共有", "subcategory": "handover", "sub_label": "申し送り", "ai_tool": "", "minutes": 15.0, "count": 1, "pct": 2.8, "min_per_session": 5.0}, {"category": "record", "cat_label": "記録", "subcategory": "doc", "sub_label": "その他書類・記録", "ai_tool": "", "minutes": 14.0, "count": 1, "pct": 2.6, "min_per_session": 4.7}, {"category": "indirect", "cat_label": "間接看護", "subcategory": "order", "sub_label": "指示受け・確認", "ai_tool": "", "minutes": 12.0, "count": 1, "pct": 2.2, "min_per_session": 4.0}, {"category": "direct", "cat_label": "直接看護", "subcategory": "explain", "sub_label": "患者対応・説明", "ai_tool": "", "minutes": 12.0, "count": 1, "pct": 2.2, "min_per_session": 4.0}, {"category": "misc", "cat_label": "移動・教育・その他", "subcategory": "walk", "sub_label": "移動（病棟内・院内）", "ai_tool": "", "minutes": 10.0, "count": 1, "pct": 1.8, "min_per_session": 3.3}, {"category": "share", "cat_label": "情報共有", "subcategory": "phone", "sub_label": "電話・連絡対応", "ai_tool": "", "minutes": 8.0, "count": 1, "pct": 1.5, "min_per_session": 2.7}], "ai_baseline": [{"category": "record", "cat_label": "記録", "subcategory": "soap", "sub_label": "看護記録・SOAP入力", "ai_tool": "medai SOAP Voice", "minutes": 100.0, "count": 4, "pct": 18.4, "min_per_session": 33.3}, {"category": "record", "cat_label": "記録", "subcategory": "summary", "sub_label": "退院時サマリー作成", "ai_tool": "SummyAI", "minutes": 68.0, "count": 3, "pct": 12.5, "min_per_session": 22.7}, {"category": "share", "cat_label": "情報共有", "subcategory": "conf", "sub_label": "カンファレンス・会議", "ai_tool": "議事録自動生成", "minutes": 62.0, "count": 2, "pct": 11.4, "min_per_session": 20.7}]};
const DEMO_CONFIG = {"categories": [{"key": "direct", "label": "直接看護", "color": "#0f766e", "subs": [{"key": "obs", "label": "観察・バイタル測定"}, {"key": "care", "label": "処置・与薬"}, {"key": "adl", "label": "清潔・排泄ケア"}, {"key": "move", "label": "移乗・移動介助"}, {"key": "explain", "label": "患者対応・説明"}]}, {"key": "indirect", "label": "間接看護", "color": "#2563eb", "subs": [{"key": "order", "label": "指示受け・確認"}, {"key": "prep", "label": "物品準備・片付け"}, {"key": "env", "label": "環境整備"}, {"key": "coord", "label": "連絡・調整"}]}, {"key": "record", "label": "記録", "color": "#b45309", "subs": [{"key": "soap", "label": "看護記録・SOAP入力", "ai_tool": "medai SOAP Voice"}, {"key": "summary", "label": "退院時サマリー作成", "ai_tool": "SummyAI"}, {"key": "chart", "label": "温度板・観察記録入力"}, {"key": "doc", "label": "その他書類・記録"}]}, {"key": "share", "label": "情報共有", "color": "#7c3aed", "subs": [{"key": "handover", "label": "申し送り"}, {"key": "conf", "label": "カンファレンス・会議", "ai_tool": "議事録自動生成"}, {"key": "phone", "label": "電話・連絡対応"}]}, {"key": "misc", "label": "移動・教育・その他", "color": "#475569", "subs": [{"key": "walk", "label": "移動（病棟内・院内）"}, {"key": "edu", "label": "指導・教育・委員会"}, {"key": "other", "label": "その他業務"}]}, {"key": "off", "label": "休憩・待機", "color": "#64748b", "subs": [{"key": "break", "label": "休憩"}, {"key": "standby", "label": "待機"}]}], "wards": ["病棟A", "病棟B", "病棟C", "その他"], "shifts": ["日勤", "夜勤", "早出", "遅出"], "staff": ["N-01", "N-02", "N-03", "N-04", "N-05", "N-06", "N-07", "N-08", "N-09", "N-10", "N-11", "N-12", "N-13", "N-14", "N-15", "N-16", "N-17", "N-18", "N-19", "N-20"]};
(function(){
  const orig=window.fetch.bind(window);
  window.fetch=async(url,opts={})=>{
    const u=typeof url==="string"?url:(url&&url.url)||"";
    const J=o=>new Response(JSON.stringify(o),{status:200,headers:{"Content-Type":"application/json"}});
    if(u.includes("/api/config")) return J(DEMO_CONFIG);
    if(u.includes("/api/summary")) return J(DEMO_SUMMARY);
    return orig(url,opts);
  };
})();
</script>

<script>
const $=s=>document.querySelector(s);
const CATCOLORS={};

async function init(){
  const cfg=await (await fetch("/api/config")).json();
  cfg.wards.forEach(w=>$("#ward").insertAdjacentHTML("beforeend",`<option>${w}</option>`));
  cfg.shifts.forEach(s=>$("#shift").insertAdjacentHTML("beforeend",`<option>${s}</option>`));
  cfg.categories.forEach(c=>CATCOLORS[c.key]=c.color);
  // 既定: 直近14日
  const today=new Date(); const past=new Date(Date.now()-13*864e5);
  $("#to").value=iso(today); $("#from").value=iso(past);
  load();
}
function iso(d){return d.toISOString().slice(0,10);}

function qs(){
  const p=new URLSearchParams();
  if($("#from").value)p.set("from",$("#from").value);
  if($("#to").value)p.set("to",$("#to").value);
  if($("#ward").value)p.set("ward",$("#ward").value);
  if($("#shift").value)p.set("shift",$("#shift").value);
  if($("#susp").checked)p.set("include_suspect","true");
  return p.toString();
}

async function load(){
  const d=await (await fetch("/api/summary?"+qs())).json();
  $("#mSessions").textContent=d.n_sessions;
  $("#mTotal").textContent=(d.total_minutes/60).toFixed(1);
  $("#mIntervals").textContent=d.n_intervals;

  // AIベースライン
  const g=$("#aiGrid"); g.innerHTML="";
  if(!d.ai_baseline.length){ g.innerHTML=`<div class="empty">対象業務の記録がまだありません</div>`; }
  d.ai_baseline.forEach(a=>{
    g.insertAdjacentHTML("beforeend",`
      <div class="ai-item">
        <div class="ai-tool">${a.ai_tool}</div>
        <div class="ai-name">${a.sub_label}</div>
        <div><span class="ai-big">${a.min_per_session}</span> <span class="ai-unit">分/シフト</span></div>
        <div class="ai-sup">合計 ${a.minutes}分 ・ ${a.count}回 ・ 全体の${a.pct}%</div>
      </div>`);
  });

  // 大区分バー
  const cb=$("#catBars"); cb.innerHTML="";
  const max=Math.max(...d.categories.map(c=>c.minutes),1);
  d.categories.forEach(c=>{
    const w=Math.round(c.minutes/max*100);
    cb.insertAdjacentHTML("beforeend",`
      <div class="bar">
        <div class="name">${c.cat_label}</div>
        <div class="track"><div class="fill" style="width:${w}%;background:${CATCOLORS[c.category]||'#0f766e'}"></div></div>
        <div class="val">${c.minutes}分 (${c.pct}%)</div>
      </div>`);
  });
  if(!d.categories.length) cb.innerHTML=`<div class="empty">データがありません</div>`;

  // 小区分テーブル
  const tb=$("#subRows"); tb.innerHTML="";
  d.subcategories.forEach(s=>{
    tb.insertAdjacentHTML("beforeend",`
      <tr>
        <td>${s.cat_label}</td>
        <td>${s.sub_label} ${s.ai_tool?`<span class="tag">${s.ai_tool}</span>`:""}</td>
        <td class="num">${s.minutes}</td>
        <td class="num">${s.min_per_session}</td>
        <td class="num">${s.count}</td>
        <td class="num">${s.pct}%</td>
      </tr>`);
  });
  $("#subEmpty").style.display = d.subcategories.length ? "none":"block";
}

$("#apply").onclick=load;
$("#csv").onclick=()=>{ location.href="/api/export.csv?"+qs(); };
init();
</script>
<script>const _c=document.querySelector("#csv"); if(_c) _c.onclick=()=>alert("デモではCSV出力は無効です（実運用版では有効）。");</script>
</body>
</html>
